services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      CACHE_DIR: /app/.cache/sobrano
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - selection-cache:/app/.cache/sobrano
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  selection-cache:
